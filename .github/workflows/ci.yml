name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: |
          node --check src/config.js
          node --check src/crypto.js
          node --check src/token-store.js
          node --check src/etsy.js
          node --check src/etsy-service.js
          node --check src/server.js
